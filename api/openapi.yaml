openapi: 3.1.0
info:
  title: StashBert API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Status des Servers
      responses:
        "200":
          description: Der Server läuft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /products:
    get:
      operationId: listProducts
      summary: Alle Produkte, sortiert nach Name
      responses:
        "200":
          description: Alle Produkte mit ihren Barcodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: createProduct
      summary: Produkt manuell anlegen
      description: "Fehler-code: invalid_request (400), barcode_in_use (409), invalid_barcode (422)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Das angelegte Produkt mit seinen Barcodes.
          headers:
            Location:
              description: Pfad des Produkts, /api/v1/products/{id}.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProduct
      summary: Ein Produkt
      description: "Fehler-code: not_found (404)."
      responses:
        "200":
          description: Das Produkt mit seinen Barcodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updateProduct
      summary: Produkt ändern (JSON Merge Patch)
      description: "Fehler-code: invalid_request (400), not_found (404)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatch"
      responses:
        "200":
          description: Das geänderte Produkt mit seinen Barcodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteProduct
      summary: Produkt mit Barcodes, Buchungen und Bild löschen
      description: "Fehler-code: not_found (404)."
      responses:
        "204":
          description: Das Produkt ist gelöscht.
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /products/{id}/barcodes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: addBarcode
      summary: Barcode einem Produkt zuordnen
      description: "Fehler-code: invalid_request (400), not_found (404), barcode_in_use (409), invalid_barcode (422)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarcodeInput"
      responses:
        "201":
          description: Der zugeordnete Barcode, normalisiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Barcode"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /products/{id}/barcodes/{code}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: path
        required: true
        description: Barcode, wird vor dem Vergleich normalisiert.
        schema:
          type: string
    delete:
      operationId: removeBarcode
      summary: Barcode von einem Produkt entfernen
      description: "Fehler-code: not_found (404), auch bei ungültigem Barcode."
      responses:
        "204":
          description: Der Barcode ist entfernt.
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /products/{id}/merge:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Produkts, das in das Zielprodukt überführt und danach gelöscht wird.
        schema:
          type: string
    post:
      operationId: mergeProduct
      summary: Produkt in ein anderes Produkt überführen
      description: >-
        Barcodes und Buchungen des Produkts id gehen auf das Zielprodukt über.
        Hat das Produkt id Bestand, bekommt das Ziel eine Buchung mit kind
        merge und delta gleich diesem Bestand; ohne Bestand gibt es keine
        Buchung. Hat das Ziel keine Kastengröße (crate_size), übernimmt es die
        des Produkts id. Danach wird das Produkt id mit seinem Bild gelöscht.
        Die übrigen Felder des Ziels bleiben unverändert. Fehler-code:
        invalid_request (400, auch wenn Ziel und Quelle gleich sind),
        not_found (404).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductMerge"
      responses:
        "200":
          description: Das Zielprodukt mit seinen Barcodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /products/{id}/image:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProductImage
      summary: Produktbild
      description: "Fehler-code: not_found (404), auch wenn das Produkt kein Bild hat oder die Bilddatei fehlt."
      responses:
        "200":
          description: Das Bild als JPEG, PNG oder WebP.
          headers:
            Cache-Control:
              description: Immer private, max-age=86400.
              required: true
              schema:
                type: string
          content:
            image/*: {}
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: uploadProductImage
      summary: Eigenes Foto als Produktbild hochladen
      description: >-
        Der Body ist das Bild, höchstens 2 MB. Erlaubt sind image/jpeg,
        image/png und image/webp; der Typ wird am Inhalt erkannt, nicht am
        Content-Type. Ein vorhandenes Bild wird ersetzt und die Bildquelle von
        Open Food Facts entfernt. Fehler-code: invalid_request (400),
        not_found (404), invalid_image (422, größer als 2 MB oder kein JPEG,
        PNG oder WebP).
      requestBody:
        required: true
        content:
          image/*: {}
      responses:
        "200":
          description: Das Produkt mit seinen Barcodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteProductImage
      summary: Produktbild und Bildquelle entfernen
      description: >-
        Entfernt die Bilddatei und die Bildquelle von Open Food Facts, damit
        das Bild nicht erneut geladen wird. Ein Produkt ohne Bild ist kein
        Fehler. Fehler-code: not_found (404).
      responses:
        "204":
          description: Das Produkt hat kein Bild mehr.
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /movements:
    get:
      operationId: listMovements
      summary: Buchungen, neueste zuerst
      description: >-
        Sortiert nach id absteigend, seitenweise über cursor. Ein unbekanntes
        product_id ergibt eine leere Liste. Fehler-code: invalid_request (400).
      parameters:
        - name: product_id
          in: query
          required: false
          description: Nur die Buchungen dieses Produkts.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Höchstzahl der Buchungen auf der Seite.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: >-
            next_cursor der vorigen Seite, also die id ihres letzten Eintrags.
            Die Seite enthält nur Buchungen mit kleinerer id. Ein Wert, der
            keine UUID ist, ergibt invalid_request.
          schema:
            type: string
      responses:
        "200":
          description: Eine Seite der Buchungen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementList"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: createMovement
      summary: Buchung anlegen
      description: "Fehler-code: invalid_request (400), not_found (404), unknown_barcode (404), stock_already_zero (409), invalid_barcode (422), idempotency_key_mismatch (422)."
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Schlüssel für Wiederholungen. Gleicher Schlüssel mit gleichem Body
            bucht nicht erneut, sondern liefert 201 mit der aus der
            gespeicherten Buchung rekonstruierten Antwort (aktuelles Produkt,
            product_created false, warnings leer). Gleicher Schlüssel mit
            anderem Body ergibt idempotency_key_mismatch.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementCreate"
      responses:
        "201":
          description: Die angelegte Buchung mit dem geänderten Produkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementResult"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /movements/{id}/reversal:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Buchung, die storniert wird.
        schema:
          type: string
    post:
      operationId: reverseMovement
      summary: Buchung stornieren
      description: >-
        Legt eine Buchung mit kind reversal an, die die Änderung der Buchung
        id zurücknimmt. Würde der Bestand negativ, wird er 0 mit der Warnung
        clamped_to_zero; delta ist die tatsächliche Änderung. Buchungen der
        Arten reversal und merge sind nicht stornierbar. Fehler-code:
        invalid_request (400), not_found (404), already_reversed (409),
        not_reversible (409), idempotency_key_mismatch (422).
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Schlüssel für Wiederholungen. Gleicher Schlüssel für dieselbe
            Buchung storniert nicht erneut, sondern liefert 201 mit der aus der
            gespeicherten Stornobuchung rekonstruierten Antwort (aktuelles
            Produkt, product_created false, warnings leer). Gleicher Schlüssel
            für eine andere Anfrage ergibt idempotency_key_mismatch.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        "201":
          description: Die Stornobuchung mit dem geänderten Produkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementResult"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /shopping-list:
    get:
      operationId: getShoppingList
      summary: Einkaufsliste, sortiert nach Name
      description: >-
        Alle Produkte mit missing größer 0 oder mit Vormerkung (marked),
        sortiert nach Name ohne Beachtung der Groß- und Kleinschreibung.
      responses:
        "200":
          description: Die Produkte, bei denen etwas fehlt oder die vorgemerkt sind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingList"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /shopping-list/items:
    post:
      operationId: markShoppingItem
      summary: Produkt für den Einkauf vormerken
      description: >-
        Merkt das Produkt für den Einkauf vor (marked true), bestimmt über
        product_id oder barcode. Ändert nie den Bestand und legt keine Buchung
        an. Ein unbekannter Barcode legt das Produkt wie beim Einlagern an,
        aber ohne Buchung, also mit Bestand 0, und merkt es vor. Ein schon
        vorgemerktes Produkt bleibt unverändert. Fehler-code:
        invalid_request (400), not_found (404), invalid_barcode (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkCreate"
      responses:
        "200":
          description: Das vorgemerkte Produkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkResult"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /shopping-list/items/{product_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        description: ID des Produkts, dessen Vormerkung entfernt wird.
        schema:
          type: string
    delete:
      operationId: unmarkShoppingItem
      summary: Vormerkung entfernen
      description: >-
        Setzt marked auf false. Ein Fehlbestand nach Soll bleibt auf der
        Einkaufsliste. Ein nicht vorgemerktes Produkt bleibt unverändert.
        Fehler-code: not_found (404).
      responses:
        "204":
          description: Das Produkt ist nicht vorgemerkt.
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /shopping-list/snapshot:
    post:
      operationId: sendShoppingSnapshot
      summary: Einkaufsliste per MQTT neu senden
      description: >-
        Fordert das Ereignis shopping.snapshot an: alle Produkte mit Soll
        größer 0 oder mit Vormerkung, für die gewählte Zielliste. Es geht über
        die Outbox per MQTT hinaus. Mehrere Anfragen innerhalb von 2 s ergeben
        einen Snapshot. Fehler-code: mqtt_disabled (409, ohne MQTT).
      responses:
        "202":
          description: Der Snapshot ist angefordert.
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /summary:
    get:
      operationId: getSummary
      summary: Zusammenfassung des Vorrats
      description: >-
        Zählungen über alle Produkte und die ersten 100 Einträge der
        Einkaufsliste. Immer verfügbar, auch ohne MQTT. Mit MQTT geht dasselbe
        JSON retained auf <MQTT_TOPIC_PREFIX>/state/summary hinaus.
      responses:
        "200":
          description: Die Zusammenfassung.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /system:
    get:
      operationId: getSystemStatus
      summary: Zustand für die Einstellungen
      description: >-
        Version, Größe der Datenbank, die regelmäßigen Backups in
        DATA_DIR/backups und ob Open Food Facts eingerichtet ist.
        Verbindungsdaten und Geheimnisse gibt der Endpunkt nicht aus.
      responses:
        "200":
          description: Der Zustand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /backup:
    get:
      operationId: downloadBackup
      summary: Backup herunterladen
      description: >-
        Frisches Backup als tar-Archiv mit gzip: stashbert.db (eine Kopie
        per VACUUM INTO) und der Ordner images/ mit allen Bilddateien.
        Gleichzeitige Downloads laufen nacheinander. Ohne Anmeldung
        (ADR-0013) kann das jeder im Heimnetz; eingespielt wird das Archiv
        mit POST /backup/restore.
      responses:
        "200":
          description: Das Archiv.
          headers:
            Content-Disposition:
              description: >-
                attachment; filename="stashbert-<YYYYMMDD-HHMMSS>.tar.gz" mit
                der Zeit des Backups in UTC.
              required: true
              schema:
                type: string
          content:
            application/gzip: {}
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /backup/restore:
    post:
      operationId: restoreBackup
      summary: Backup einspielen
      description: >-
        Der Body ist ein Archiv aus GET /backup, höchstens 1 GB, mit dem
        Content-Type application/gzip (application/x-gzip geht auch). Es darf
        nur stashbert.db und Bilder unter images/ enthalten und entpackt
        höchstens 4 GB groß sein. StashBert prüft das Archiv und legt es in
        DATA_DIR/restore/pending bereit, ohne den laufenden Betrieb zu ändern.
        Nach der Antwort startet StashBert im selben Prozess neu und spielt es
        vor dem Öffnen der Datenbank ein; der bisherige Stand bleibt in
        DATA_DIR/vor-restore-<YYYYMMDD-HHMMSS>. Ohne Anmeldung (ADR-0013) kann
        das jeder im Heimnetz (ADR-0020). Fehler-code: invalid_request (400,
        anderer Content-Type), invalid_backup (422, kein Backup von StashBert
        oder beschädigt), backup_too_new (422, von einer neueren Version),
        backup_too_large (413, größer als 1 GB oder entpackt größer als
        4 GB), restore_in_progress (409, es wird schon ein Backup
        eingespielt).
      requestBody:
        required: true
        content:
          application/gzip: {}
      responses:
        "202":
          description: Das Backup ist bereitgelegt; StashBert startet neu.
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /integrations/mqtt:
    get:
      operationId: getMqttStatus
      summary: MQTT-Verbindung und Zielliste
      description: >-
        Zustand der Verbindung zum Broker, die von Home Assistant auf
        <MQTT_TOPIC_PREFIX>/in/targets angebotenen Ziellisten und die gewählte
        Zielliste. Immer verfügbar, auch ohne MQTT (dann status disabled und
        keine angebotenen Listen).
      responses:
        "200":
          description: Verbindung, angebotene und gewählte Zielliste.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MqttStatus"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /integrations/mqtt/target:
    put:
      operationId: setShoppingTarget
      summary: Zielliste wählen
      description: >-
        Wählt die Liste in Home Assistant, in die die Einkaufsliste geht, oder
        hebt die Wahl mit id null auf. Beim Wechsel geht zuerst ein
        shopping.snapshot hinaus, der die alte Liste abräumt (falls eine
        gewählt war), danach einer für die neue Liste (falls es eine gibt).
        Dieselbe Liste erneut zu wählen ändert nichts. Fehler-code:
        invalid_request (400), mqtt_disabled (409, ohne MQTT),
        unknown_target (422, die id ist nicht im aktuellen Angebot).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingTargetChoice"
      responses:
        "200":
          description: Verbindung, angebotene und gewählte Zielliste nach der Wahl.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MqttStatus"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Problem:
      type: object
      description: Fehler nach RFC 9457 mit zusätzlichem Feld code.
      required:
        - title
        - status
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
    Health:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
    Barcode:
      type: object
      required:
        - code
        - units
      properties:
        code:
          type: string
          description: Normalisierter Barcode.
        units:
          type: integer
          description: Stückzahl, die ein Scan dieses Barcodes bucht.
    Product:
      type: object
      required:
        - id
        - name
        - brand
        - package_size
        - note
        - stock
        - target
        - min_stock
        - missing
        - marked
        - needs_review
        - origin
        - lookup_state
        - has_image
        - crate_size
        - barcodes
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        brand:
          type: [string, "null"]
        package_size:
          type: [string, "null"]
        note:
          type: [string, "null"]
        stock:
          type: integer
          description: Bestand. Nur lesen, er ändert sich nur durch Buchungen.
        target:
          type: integer
          description: Sollbestand.
        min_stock:
          type: [integer, "null"]
          description: Mindestbestand. Ohne Wert gilt der Sollbestand als Schwelle.
        missing:
          type: integer
          description: Fehlmenge für die Einkaufsliste. Nur lesen, wird berechnet.
        marked:
          type: boolean
          description: >-
            Für den Einkauf vorgemerkt. Nur lesen; eine Buchung add beendet die
            Vormerkung.
        needs_review:
          type: boolean
        origin:
          type: string
          enum:
            - openfoodfacts
            - openbeautyfacts
            - openpetfoodfacts
            - openproductsfacts
            - manual
            - placeholder
        lookup_state:
          type: string
          enum:
            - none
            - pending
            - done
            - not_found
        has_image:
          type: boolean
        crate_size:
          type: [integer, "null"]
          minimum: 2
          maximum: 100
          description: >-
            Flaschen pro Kasten. null, wenn das Produkt nicht in Kästen gekauft
            wird. Bestand und Sollbestand bleiben in Flaschen.
        barcodes:
          type: array
          description: Barcodes, sortiert nach Code.
          items:
            $ref: "#/components/schemas/Barcode"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    BarcodeInput:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: EAN-8, UPC-A, EAN-13 oder GTIN-14. Wird normalisiert gespeichert.
        units:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          description: Stückzahl, die ein Scan dieses Barcodes bucht.
    ProductCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Wird getrimmt, danach 1 bis 120 Zeichen.
        brand:
          type: string
          description: Wird getrimmt, danach höchstens 120 Zeichen. Leer wird null.
        package_size:
          type: string
          description: Wird getrimmt, danach höchstens 40 Zeichen. Leer wird null.
        target:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
          description: Sollbestand.
        min_stock:
          type: integer
          minimum: 0
          maximum: 100000
          description: Mindestbestand, höchstens target.
        note:
          type: string
          description: Wird getrimmt, danach höchstens 500 Zeichen. Leer wird null.
        crate_size:
          type: [integer, "null"]
          minimum: 2
          maximum: 100
          description: Flaschen pro Kasten. Ohne Wert oder null wird das Produkt nicht in Kästen gekauft.
        barcodes:
          type: array
          description: Barcodes des Produkts. Jeder Code darf nur einmal vorkommen.
          items:
            $ref: "#/components/schemas/BarcodeInput"
    ProductPatch:
      type: object
      description: >-
        JSON Merge Patch. Ein fehlendes Feld bleibt unverändert, null löscht ein
        nullbares Feld. needs_review wird false, wenn der Patch name, brand oder
        package_size enthält.
      properties:
        name:
          type: string
          description: Wird getrimmt, danach 1 bis 120 Zeichen.
        brand:
          type: [string, "null"]
          description: Wird getrimmt, danach höchstens 120 Zeichen. Leer wird null.
        package_size:
          type: [string, "null"]
          description: Wird getrimmt, danach höchstens 40 Zeichen. Leer wird null.
        target:
          type: integer
          minimum: 0
          maximum: 100000
          description: Sollbestand.
        min_stock:
          type: [integer, "null"]
          minimum: 0
          maximum: 100000
          description: Mindestbestand, nach dem Ändern höchstens target.
        note:
          type: [string, "null"]
          description: Wird getrimmt, danach höchstens 500 Zeichen. Leer wird null.
        crate_size:
          type: [integer, "null"]
          minimum: 2
          maximum: 100
          description: Flaschen pro Kasten. null löscht die Kastengröße.
    ProductMerge:
      type: object
      required:
        - target_product_id
      properties:
        target_product_id:
          type: string
          description: ID des Zielprodukts. Muss sich von der ID der Quelle unterscheiden.
    MovementCreate:
      type: object
      description: >-
        Buchung für ein Produkt, bestimmt über product_id oder barcode. Genau
        eines der beiden Felder muss gesetzt sein, sonst invalid_request.
        quantity gilt für add und consume, stock ist bei inventory Pflicht und
        bei add und consume nicht erlaubt.
      required:
        - kind
      properties:
        product_id:
          type: string
        barcode:
          type: string
          description: >-
            EAN-8, UPC-A, EAN-13 oder GTIN-14, wird normalisiert. Die Menge
            für add und consume ist quantity × units des Barcodes; inventory
            ignoriert units.
        kind:
          type: string
          enum:
            - add
            - consume
            - inventory
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          description: Menge für add und consume.
        stock:
          type: integer
          minimum: 0
          maximum: 100000
          description: Neuer Bestand für inventory.
    Movement:
      type: object
      required:
        - id
        - product_id
        - kind
        - delta
        - stock_after
        - barcode
        - reverses_id
        - created_at
      properties:
        id:
          type: string
        product_id:
          type: string
        kind:
          type: string
          enum:
            - add
            - consume
            - inventory
            - reversal
            - merge
        delta:
          type: integer
          description: Tatsächliche Änderung des Bestands, darf 0 sein.
        stock_after:
          type: integer
          description: Bestand nach der Buchung.
        barcode:
          type: [string, "null"]
          description: Normalisierter Barcode, falls per Barcode gebucht wurde.
        reverses_id:
          type: [string, "null"]
          description: ID der stornierten Buchung, nur bei kind reversal.
        created_at:
          type: string
          format: date-time
    MovementList:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          description: Buchungen, sortiert nach id absteigend.
          items:
            $ref: "#/components/schemas/Movement"
        next_cursor:
          type: [string, "null"]
          description: cursor für die nächste Seite, null auf der letzten Seite.
    MovementResult:
      type: object
      required:
        - movement
        - product
        - product_created
        - warnings
        - message
      properties:
        movement:
          $ref: "#/components/schemas/Movement"
        product:
          $ref: "#/components/schemas/Product"
        product_created:
          type: boolean
          description: true, wenn das Produkt mit dieser Buchung angelegt wurde.
        warnings:
          type: array
          description: Hinweise zur Buchung, z. B. clamped_to_zero, wenn der Bestand auf 0 begrenzt wurde.
          items:
            type: string
        message:
          type: string
          description: Fertiger deutscher Anzeigetext, z. B. "Kidneybohnen 3 → 2".
    ShoppingItem:
      type: object
      required:
        - product_id
        - name
        - brand
        - missing
        - stock
        - target
        - marked
        - crate_size
      properties:
        product_id:
          type: string
        name:
          type: string
        brand:
          type: [string, "null"]
        missing:
          type: integer
          description: >-
            Fehlmenge, die gekauft werden muss. 0 bei einem vorgemerkten
            Produkt ohne Fehlbestand.
        stock:
          type: integer
          description: Bestand.
        target:
          type: integer
          description: Sollbestand.
        marked:
          type: boolean
          description: Für den Einkauf vorgemerkt. Nur lesen.
        crate_size:
          type: [integer, "null"]
          minimum: 2
          maximum: 100
          description: Flaschen pro Kasten oder null. missing, stock und target bleiben in Flaschen.
    MarkCreate:
      type: object
      description: >-
        Vormerkung für ein Produkt, bestimmt über product_id oder barcode.
        Genau eines der beiden Felder muss gesetzt sein, sonst invalid_request.
      properties:
        product_id:
          type: string
        barcode:
          type: string
          description: EAN-8, UPC-A, EAN-13 oder GTIN-14, wird normalisiert.
    MarkResult:
      type: object
      required:
        - product
        - product_created
        - already_listed
        - message
      properties:
        product:
          $ref: "#/components/schemas/Product"
        product_created:
          type: boolean
          description: true, wenn das Produkt für einen unbekannten Barcode angelegt wurde.
        already_listed:
          type: boolean
          description: >-
            true, wenn das Produkt schon vorher auf der Einkaufsliste stand,
            wegen missing größer 0 oder marked.
        message:
          type: string
          description: >-
            Fertiger deutscher Anzeigetext: "Vorgemerkt: <name>", "Neu
            vorgemerkt: <name>" oder "Schon auf der Liste: <name>".
    ShoppingList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShoppingItem"
    Summary:
      type: object
      required:
        - product_count
        - shopping_count
        - empty_count
        - review_count
        - shopping
        - shopping_truncated
      properties:
        product_count:
          type: integer
          description: Alle Produkte.
        shopping_count:
          type: integer
          description: Einträge der Einkaufsliste (missing größer 0 oder marked).
        empty_count:
          type: integer
          description: Produkte mit Bestand 0, wie der Filter „Leer".
        review_count:
          type: integer
          description: Produkte mit needs_review, wie der Filter „Prüfen".
        shopping:
          type: array
          maxItems: 100
          description: >-
            Die ersten 100 Einträge der Einkaufsliste in ihrer Reihenfolge
            (nach Name wie GET /shopping-list).
          items:
            type: object
            x-go-type-name: SummaryItem
            required:
              - name
              - missing
              - quantity
              - unit
            properties:
              name:
                type: string
              missing:
                type: integer
                description: >-
                  Fehlmenge, die gekauft werden muss (bei Kästen in Flaschen).
                  0 bei einem vorgemerkten Produkt ohne Fehlbestand.
              quantity:
                type: integer
                description: >-
                  Menge zum Einkaufen in unit: mit Kastengröße missing durch
                  crate_size, aufgerundet, sonst missing.
              unit:
                type: string
                enum:
                  - piece
                  - crate
                description: crate mit Kastengröße, sonst piece.
        shopping_truncated:
          type: boolean
          description: true, wenn die Einkaufsliste mehr als 100 Einträge hat.
    SystemStatus:
      type: object
      required:
        - version
        - database_size
        - backup_count
        - last_backup_at
        - backup_keep
        - open_food_facts
      properties:
        version:
          type: string
        database_size:
          type: integer
          format: int64
          description: >-
            Bytes der Datenbankdatei stashbert.db samt WAL-Datei
            (stashbert.db-wal), falls es sie gibt.
        backup_count:
          type: integer
          description: >-
            Anzahl der regelmäßigen Backups
            stashbert-<YYYYMMDD-HHMMSS>.db in DATA_DIR/backups, ohne die
            Backups vor Migrationen (pre-migration-*).
        last_backup_at:
          type: [string, "null"]
          format: date-time
          description: >-
            Zeit des neuesten regelmäßigen Backups, gelesen aus ihrem
            Dateinamen (UTC, auf die Sekunde), oder null ohne Backup.
        backup_keep:
          type: integer
          description: Anzahl der aufbewahrten täglichen Backups (BACKUP_KEEP).
        open_food_facts:
          type: boolean
          description: >-
            true, wenn OFF_CONTACT gesetzt ist und unbekannte Barcodes bei Open
            Food Facts nachgeschlagen werden.
    ShoppingTarget:
      type: object
      description: Eine Liste in Home Assistant, in die die Einkaufsliste gehen kann.
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Undurchsichtige Kennung aus Home Assistant, z. B. todo.bring_zuhause.
        name:
          type: string
          description: Anzeigename der Liste.
    ShoppingTargetChoice:
      type: object
      required:
        - id
      properties:
        id:
          type: [string, "null"]
          description: >-
            Kennung einer gerade angebotenen Liste oder null, um die Wahl
            aufzuheben.
    MqttStatus:
      type: object
      required:
        - status
        - targets
        - target
      properties:
        status:
          type: string
          enum:
            - disabled
            - connecting
            - connected
          description: >-
            disabled ohne MQTT, connecting ohne Verbindung zum Broker (der
            Client versucht es weiter), connected mit Verbindung.
        targets:
          type: array
          description: >-
            Die zuletzt von Home Assistant angebotenen Ziellisten in ihrer
            Reihenfolge. Leer ohne MQTT oder ohne gültiges Angebot.
          items:
            $ref: "#/components/schemas/ShoppingTarget"
        target:
          description: >-
            Die gewählte Zielliste, auch wenn sie gerade nicht angeboten wird,
            oder null.
          anyOf:
            - $ref: "#/components/schemas/ShoppingTarget"
            - type: "null"
