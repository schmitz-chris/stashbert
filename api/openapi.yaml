openapi: 3.1.0
info:
  title: StashBert API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Status des Servers
      responses:
        "200":
          description: Der Server läuft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Problem:
      type: object
      description: Fehler nach RFC 9457 mit zusätzlichem Feld code.
      required:
        - title
        - status
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
    Health:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
