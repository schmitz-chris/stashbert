openapi: 3.1.0
info:
  title: StashBert API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Status des Servers
      responses:
        "200":
          description: Der Server läuft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /products:
    get:
      operationId: listProducts
      summary: Alle Produkte, sortiert nach Name
      responses:
        "200":
          description: Alle Produkte mit ihren Barcodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: createProduct
      summary: Produkt manuell anlegen
      description: "Fehler-code: invalid_request (400), barcode_in_use (409), invalid_barcode (422)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Das angelegte Produkt mit seinen Barcodes.
          headers:
            Location:
              description: Pfad des Produkts, /api/v1/products/{id}.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProduct
      summary: Ein Produkt
      description: "Fehler-code: not_found (404)."
      responses:
        "200":
          description: Das Produkt mit seinen Barcodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updateProduct
      summary: Produkt ändern (JSON Merge Patch)
      description: "Fehler-code: invalid_request (400), not_found (404)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatch"
      responses:
        "200":
          description: Das geänderte Produkt mit seinen Barcodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteProduct
      summary: Produkt mit Barcodes und Buchungen löschen
      description: "Fehler-code: not_found (404)."
      responses:
        "204":
          description: Das Produkt ist gelöscht.
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /products/{id}/barcodes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: addBarcode
      summary: Barcode einem Produkt zuordnen
      description: "Fehler-code: invalid_request (400), not_found (404), barcode_in_use (409), invalid_barcode (422)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarcodeInput"
      responses:
        "201":
          description: Der zugeordnete Barcode, normalisiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Barcode"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /products/{id}/barcodes/{code}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: path
        required: true
        description: Barcode, wird vor dem Vergleich normalisiert.
        schema:
          type: string
    delete:
      operationId: removeBarcode
      summary: Barcode von einem Produkt entfernen
      description: "Fehler-code: not_found (404), auch bei ungültigem Barcode."
      responses:
        "204":
          description: Der Barcode ist entfernt.
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /movements:
    post:
      operationId: createMovement
      summary: Buchung anlegen
      description: "Fehler-code: invalid_request (400), not_found (404), unknown_barcode (404), stock_already_zero (409), invalid_barcode (422)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementCreate"
      responses:
        "201":
          description: Die angelegte Buchung mit dem geänderten Produkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementResult"
        default:
          description: Fehler nach RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Problem:
      type: object
      description: Fehler nach RFC 9457 mit zusätzlichem Feld code.
      required:
        - title
        - status
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
    Health:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
    Barcode:
      type: object
      required:
        - code
        - units
      properties:
        code:
          type: string
          description: Normalisierter Barcode.
        units:
          type: integer
          description: Stückzahl, die ein Scan dieses Barcodes bucht.
    Product:
      type: object
      required:
        - id
        - name
        - brand
        - package_size
        - note
        - stock
        - target
        - min_stock
        - missing
        - needs_review
        - origin
        - lookup_state
        - has_image
        - barcodes
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        brand:
          type: [string, "null"]
        package_size:
          type: [string, "null"]
        note:
          type: [string, "null"]
        stock:
          type: integer
          description: Bestand. Nur lesen, er ändert sich nur durch Buchungen.
        target:
          type: integer
          description: Sollbestand.
        min_stock:
          type: [integer, "null"]
          description: Mindestbestand. Ohne Wert gilt der Sollbestand als Schwelle.
        missing:
          type: integer
          description: Fehlmenge für die Einkaufsliste. Nur lesen, wird berechnet.
        needs_review:
          type: boolean
        origin:
          type: string
          enum:
            - openfoodfacts
            - openbeautyfacts
            - openpetfoodfacts
            - openproductsfacts
            - manual
            - placeholder
        lookup_state:
          type: string
          enum:
            - none
            - pending
            - done
            - not_found
        has_image:
          type: boolean
        barcodes:
          type: array
          description: Barcodes, sortiert nach Code.
          items:
            $ref: "#/components/schemas/Barcode"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    BarcodeInput:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: EAN-8, UPC-A, EAN-13 oder GTIN-14. Wird normalisiert gespeichert.
        units:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          description: Stückzahl, die ein Scan dieses Barcodes bucht.
    ProductCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Wird getrimmt, danach 1 bis 120 Zeichen.
        brand:
          type: string
          description: Wird getrimmt, danach höchstens 120 Zeichen. Leer wird null.
        package_size:
          type: string
          description: Wird getrimmt, danach höchstens 40 Zeichen. Leer wird null.
        target:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
          description: Sollbestand.
        min_stock:
          type: integer
          minimum: 0
          maximum: 100000
          description: Mindestbestand, höchstens target.
        note:
          type: string
          description: Wird getrimmt, danach höchstens 500 Zeichen. Leer wird null.
        barcodes:
          type: array
          description: Barcodes des Produkts. Jeder Code darf nur einmal vorkommen.
          items:
            $ref: "#/components/schemas/BarcodeInput"
    ProductPatch:
      type: object
      description: >-
        JSON Merge Patch. Ein fehlendes Feld bleibt unverändert, null löscht ein
        nullbares Feld. needs_review wird false, wenn der Patch name, brand oder
        package_size enthält.
      properties:
        name:
          type: string
          description: Wird getrimmt, danach 1 bis 120 Zeichen.
        brand:
          type: [string, "null"]
          description: Wird getrimmt, danach höchstens 120 Zeichen. Leer wird null.
        package_size:
          type: [string, "null"]
          description: Wird getrimmt, danach höchstens 40 Zeichen. Leer wird null.
        target:
          type: integer
          minimum: 0
          maximum: 100000
          description: Sollbestand.
        min_stock:
          type: [integer, "null"]
          minimum: 0
          maximum: 100000
          description: Mindestbestand, nach dem Ändern höchstens target.
        note:
          type: [string, "null"]
          description: Wird getrimmt, danach höchstens 500 Zeichen. Leer wird null.
    MovementCreate:
      type: object
      description: >-
        Buchung für ein Produkt, bestimmt über product_id oder barcode. Genau
        eines der beiden Felder muss gesetzt sein, sonst invalid_request.
        quantity gilt für add und consume, stock ist bei inventory Pflicht und
        bei add und consume nicht erlaubt.
      required:
        - kind
      properties:
        product_id:
          type: string
        barcode:
          type: string
          description: >-
            EAN-8, UPC-A, EAN-13 oder GTIN-14, wird normalisiert. Die Menge
            für add und consume ist quantity × units des Barcodes; inventory
            ignoriert units.
        kind:
          type: string
          enum:
            - add
            - consume
            - inventory
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          description: Menge für add und consume.
        stock:
          type: integer
          minimum: 0
          maximum: 100000
          description: Neuer Bestand für inventory.
    Movement:
      type: object
      required:
        - id
        - product_id
        - kind
        - delta
        - stock_after
        - barcode
        - reverses_id
        - created_at
      properties:
        id:
          type: string
        product_id:
          type: string
        kind:
          type: string
          enum:
            - add
            - consume
            - inventory
            - reversal
            - merge
        delta:
          type: integer
          description: Tatsächliche Änderung des Bestands, darf 0 sein.
        stock_after:
          type: integer
          description: Bestand nach der Buchung.
        barcode:
          type: [string, "null"]
          description: Normalisierter Barcode, falls per Barcode gebucht wurde.
        reverses_id:
          type: [string, "null"]
          description: ID der stornierten Buchung, nur bei kind reversal.
        created_at:
          type: string
          format: date-time
    MovementResult:
      type: object
      required:
        - movement
        - product
        - product_created
        - warnings
        - message
      properties:
        movement:
          $ref: "#/components/schemas/Movement"
        product:
          $ref: "#/components/schemas/Product"
        product_created:
          type: boolean
          description: true, wenn das Produkt mit dieser Buchung angelegt wurde.
        warnings:
          type: array
          description: Hinweise zur Buchung, z. B. clamped_to_zero, wenn der Bestand auf 0 begrenzt wurde.
          items:
            type: string
        message:
          type: string
          description: Fertiger deutscher Anzeigetext, z. B. "Kidneybohnen 3 → 2".
