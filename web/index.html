<!doctype html>
<html lang="de" class="bg-canvas">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Startup images from tools/icongen: plain areas in the canvas color for iPhone 15
      (393 x 852 pt) and iPhone 16 Pro (402 x 874 pt), both @3x, portrait.
    -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/startup-1179x2556.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/startup-1206x2622.png"
    />
    <!-- The canvas color, the background of html and body (Safari 26 tints the status bar after it). -->
    <meta name="theme-color" content="#f4f3f1" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>StashBert</title>
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div
      id="root"
      class="flex min-h-dvh flex-col pt-[env(safe-area-inset-top)] pr-[env(safe-area-inset-right)] pl-[env(safe-area-inset-left)]"
    ></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
